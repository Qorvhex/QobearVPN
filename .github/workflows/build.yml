name: Build QobearVPN APKs

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override versionName (e.g. 1.0.1)"
        required: false
        default: ""
      create_release:
        description: "Publish a GitHub Release with attached APKs"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache OpenVPN 3 native sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/openvpn3/*.zip
            third_party/openvpn3/openvpn3-*
            third_party/openvpn3/mbedtls-*
            third_party/openvpn3/asio-*
            third_party/openvpn3/lz4-*
            third_party/openvpn3/fmt-*
          key: openvpn3-${{ hashFiles('third_party/openvpn3/source-lock.json') }}

      - name: Fetch and verify OpenVPN 3 native dependencies
        run: python3 scripts/fetch_openvpn_deps.py

      - name: Native C++ OpenVPN 3 profile check (all 47 TunnelBear .ovpn)
        run: |
          cmake -S app/src/main/cpp -B build/host-check \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/host-check --parallel $(nproc)
          ./build/host-check/qobear_profile_check app/src/main/assets/profiles/*.ovpn

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compute build version metadata
        id: meta
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version_name }}" ]; then
            VER="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="$TAG_VER"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug lintVitalRelease --no-daemon

      - name: Print Android Lint text report on failure
        if: failure()
        run: |
          for f in app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt app/build/reports/lint-results-*.txt; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              cat "$f"
            fi
          done

      - name: Decode release signing credentials if configured
        id: signing
        env:
          PK8_B64: ${{ secrets.QOBEAR_PK8_BASE64 }}
          X509_B64: ${{ secrets.QOBEAR_X509_BASE64 }}
          JKS_B64: ${{ secrets.QOBEAR_KEYSTORE_BASE64 }}
        run: |
          IS_RELEASE_PUBLISH=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [ "${{ inputs.create_release }}" == "true" ]; then
            IS_RELEASE_PUBLISH=true
          fi
          if [ -n "$PK8_B64" ] && [ -n "$X509_B64" ]; then
            printf '%s' "$PK8_B64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.pk8"
            printf '%s' "$X509_B64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.x509.pem"
            chmod 600 "${{ runner.temp }}/release.pk8"
            echo "pk8_mode=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          elif [ -n "$JKS_B64" ]; then
            printf '%s' "$JKS_B64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.jks"
            chmod 600 "${{ runner.temp }}/release.jks"
            echo "pk8_mode=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${{ runner.temp }}/release.jks" >> "$GITHUB_OUTPUT"
          elif [ "$IS_RELEASE_PUBLISH" == "true" ]; then
            echo "::error::Set QOBEAR_PK8_BASE64 + QOBEAR_X509_BASE64 (or QOBEAR_KEYSTORE_BASE64) secrets before publishing a Release."
            exit 1
          else
            echo "No release signing secrets set; falling back to debug-signed release APKs for artifact preview."
            echo "pk8_mode=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APKs (arm64-v8a + armeabi-v7a + universal)
        env:
          QOBEAR_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          QOBEAR_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          QOBEAR_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          QOBEAR_KEYSTORE_PASSWORD: ${{ secrets.QOBEAR_KEYSTORE_PASSWORD }}
          QOBEAR_KEY_ALIAS: ${{ secrets.QOBEAR_KEY_ALIAS }}
          QOBEAR_KEY_PASSWORD: ${{ secrets.QOBEAR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect and sign Release APKs
        env:
          PK8_MODE: ${{ steps.signing.outputs.pk8_mode }}
          QOBEAR_PK8_PASSWORD: ${{ secrets.QOBEAR_PK8_PASSWORD }}
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp -v {} dist/ \;
          if [ "$PK8_MODE" == "true" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            for apk in dist/*.apk; do
              echo "Signing $apk with Qorvhex pk8/x509.pem..."
              if [ -n "$QOBEAR_PK8_PASSWORD" ]; then
                "$APKSIGNER" sign \
                  --key "${{ runner.temp }}/release.pk8" \
                  --cert "${{ runner.temp }}/release.x509.pem" \
                  --key-pass env:QOBEAR_PK8_PASSWORD \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  "$apk"
              else
                "$APKSIGNER" sign \
                  --key "${{ runner.temp }}/release.pk8" \
                  --cert "${{ runner.temp }}/release.x509.pem" \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  "$apk"
              fi
              "$APKSIGNER" verify --print-certs "$apk"
            done
            rm -f "${{ runner.temp }}/release.pk8" "${{ runner.temp }}/release.x509.pem"
          fi
          ls -lh dist/

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QobearVPN-v${{ steps.meta.outputs.version_name }}-arm64-v8a
          path: dist/*-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QobearVPN-v${{ steps.meta.outputs.version_name }}-armeabi-v7a
          path: dist/*-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QobearVPN-v${{ steps.meta.outputs.version_name }}-universal
          path: dist/*-universal-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: QobearVPN v${{ steps.meta.outputs.version_name }}
          generate_release_notes: true
          files: dist/*.apk
